name: Confluence alerts

# Boucle quasi continue : chaque run scanne ~20 s après chaque clôture 15m pendant 5h45,
# le cron horaire en garde toujours un en attente pour enchaîner (repo public = minutes illimitées).
on:
  schedule:
    - cron: "7 * * * 0-5"   # dim soir -> ven (marchés fermés le samedi)
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notif de test"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alerts-${{ inputs.test && 'test' || 'loop' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan en boucle
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_MINUTES: "345"
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          python bot.py ${{ inputs.test && '--test' || '' }}
