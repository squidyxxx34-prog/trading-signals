name: Confluence alerts

on:
  schedule:
    - cron: "2,17,32,47 6-21 * * 1-5"   # 2 min après chaque clôture 15m, 7h-22h Paris, lun-ven (~1400 min/mois, gratuit même en privé)
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notif de test"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: alerts
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py ${{ inputs.test && '--test' || '' }}
      - name: Save state
        run: |
          [ -f state.json ] || exit 0
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state" -q && git push -q)
