name: SMC Pro alerts

# Même logique que le script Pine SMC Pro v2. Boucle de 5h45 relancée chaque heure
# (repo public = minutes GitHub Actions illimitées). Forex + métaux, dim soir -> ven.
on:
  schedule:
    - cron: "11 * * * 0-5"
  workflow_dispatch:
    inputs:
      test:
        description: "Envoyer une notif de test"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: smc-${{ inputs.test && 'test' || 'loop' }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan SMC en boucle
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LOOP_MINUTES: "345"
          PYTHONUNBUFFERED: "1"
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          python smc_bot.py ${{ inputs.test && '--test' || '' }}
