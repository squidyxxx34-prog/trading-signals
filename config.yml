# ===== Universal Confluence Pro v4 — config =====
capital: 6000          # €
risk_pct: 0.5          # % risqué par trade
timezone: Europe/Paris

timeframe: 15m         # TF du graphique (5m, 15m, 30m, 60m)
htf: 60m               # TF de confirmation (= "60" dans le Pine)

# Topic ntfy (gratuit, sans compte) : abonne-toi à ce nom dans l'app ntfy. Garde le repo privé.
ntfy_topic: confluence-1aeaec42ca

params:
  fast_len: 50
  slow_len: 200
  rsi_len: 14
  adx_len: 14
  adx_smooth: 14
  min_adx: 20
  min_score: 5
  htf_ema_len: 200
  atr_len: 14
  atr_mult: 1.5

# ticker = symbole Yahoo Finance ; point_value = gain par lot MT5 pour 1.0 de mouvement de prix
# currency_rate = conversion vers € (compte en €, symbole coté en USD -> ~0.86)
symbols:
  - name: EURUSD
    ticker: EURUSD=X
    point_value: 100000
    currency_rate: 0.86
    decimals: 5
  - name: XAUUSD
    ticker: GC=F        # futures or (proche du spot, écart de quelques $)
    point_value: 100
    currency_rate: 0.86
    decimals: 2
  # - name: US100
  #   ticker: NQ=F
  #   point_value: 1     # dépend de ton broker (taille de contrat MT5)
  #   currency_rate: 0.86
  #   decimals: 1
